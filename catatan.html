<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Akun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette One Dark */
            --bg-body: #282c34;
            --paper-bg: #21252b;
            --header-bg: #1b1f23;
            --header-rgb: 27, 31, 35;
            --accent-warm: #e5c07b;
            --accent-warm-hover: #f0d798;
            --accent-text: #282c34;
            --text-primary: #c8ccd4;
            --text-secondary: #7f848e;
            --border-color: #3e4451;
            --line-number-color: #636d83;
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        body.theme-one-dark {
            --bg-body: #282c34;
            --paper-bg: #21252b;
            --header-bg: #1b1f23;
            --header-rgb: 27, 31, 35;
            --accent-warm: #e5c07b;
            --accent-warm-hover: #f0d798;
            --accent-text: #282c34;
            --text-primary: #c8ccd4;
            --text-secondary: #7f848e;
            --border-color: #3e4451;
            --line-number-color: #636d83;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--paper-bg);
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 0;
            color: var(--text-primary);
        }

        /* Container Notepad Utama */
        .notepad-app {
            width: 100%;
            height: 100vh;
            background: var(--paper-bg);
            display: flex;
            flex-direction: column;
            border: none;
            overflow: hidden;
        }

        /* Topbar Window Hanya Tombol Close (X) */
        .notepad-topbar {
            background: var(--header-bg);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-color);
            -webkit-app-region: drag;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
        }

        .close-btn:hover {
            background: rgba(217, 119, 87, 0.2);
            color: #d97757;
        }

        /* Toolbar Hanya Tombol "+ Tambah Format Akun" */
        .notepad-toolbar {
            background: rgba(var(--header-rgb), 0.6);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .tool-btn {
            background: var(--accent-warm);
            color: var(--accent-text);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: var(--accent-warm-hover);
            transform: translateY(-1px);
        }

        /* Area Editor */
        .notepad-editor-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background-color: var(--paper-bg);
        }

        /* Nomor Baris */
        .line-numbers {
            width: 48px;
            padding: 18px 0;
            background: rgba(var(--header-rgb), 0.25);
            border-right: 1px solid var(--border-color);
            color: var(--line-number-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: right;
            padding-right: 12px;
            user-select: none;
            overflow-y: scroll;
            
            /* Sembunyikan scrollbar */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE dan Edge */
        }

        .line-numbers::-webkit-scrollbar {
            display: none; /* Chrome, Safari, dan Opera */
        }

        /* Textarea Editor */
        .notepad-editor {
            flex: 1;
            width: 100%;
            height: 100%;
            padding: 18px 20px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            overflow-y: auto;

            /* Sembunyikan scrollbar */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE dan Edge */
        }

        .notepad-editor::-webkit-scrollbar {
            display: none; /* Chrome, Safari, dan Opera */
        }

        .notepad-editor::placeholder {
            color: var(--line-number-color);
        }

        /* Footer Status Bar */
        .notepad-footer {
            background: var(--header-bg);
            padding: 8px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-info {
            display: flex;
            gap: 14px;
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-warm);
            color: var(--accent-text);
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.88rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .notepad-app {
                height: 88vh;
            }
            .line-numbers {
                display: none;
            }
            .notepad-toolbar {
                padding: 8px 12px;
            }
            .tool-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        .lock-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper-bg);
            padding: 24px;
        }
        .lock-overlay[hidden] { display: none; }
        .lock-card {
            width: min(360px, 100%);
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }
        .lock-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .lock-sub { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 18px; line-height: 1.5; }
        .lock-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 6px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--paper-bg);
            color: var(--text-primary);
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            box-sizing: border-box;
        }
        .lock-input:focus { border-color: var(--accent-warm); }
        .lock-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: var(--accent-warm);
            color: var(--accent-text);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }
        .lock-btn:hover { background: var(--accent-warm-hover); }
        .lock-err { min-height: 20px; font-size: 0.8rem; color: #e06c75; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="notepad-app" id="notepadApp">
        <!-- Topbar Window Hanya Tombol Close (X) -->
        <div class="notepad-topbar">
            <button class="close-btn" id="closeBtn" title="Tutup">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Toolbar Hanya Tombol "+ Tambah Format Akun" -->
        <div class="notepad-toolbar">
            <button class="tool-btn" id="insertBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                + Tambah Format Akun
            </button>
            <button class="tool-btn" id="changePinBtn" style="margin-left:auto;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);">
                Ganti PIN
            </button>
            <button class="tool-btn" id="exportBtn" style="margin-left:8px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export .txt
            </button>
        </div>

        <!-- Workspace Editor -->
        <div class="notepad-editor-container">
            <div class="line-numbers" id="lineNumbers">1</div>
            <textarea id="notepad" class="notepad-editor" spellcheck="false" placeholder="Ketik atau klik '+ Tambah Format Akun' di atas..."></textarea>
        </div>

        <!-- Footer Status -->
        <div class="notepad-footer">
            <div class="status-info">
                <span id="charCount">0 karakter</span>
                <span>•</span>
                <span id="lineCount">1 baris</span>
            </div>
            <div>UTF-8 | Cozy Mode</div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Format akun ditambahkan!</div>

    <div class="lock-overlay" id="lockOverlay" hidden>
        <div class="lock-card">
            <div class="lock-title" id="lockTitle">Catatan Terkunci</div>
            <div class="lock-sub" id="lockSub">Masukkan PIN 4-12 digit untuk membuka catatan.</div>
            <input class="lock-input" id="lockPin" type="password" maxlength="12" placeholder="123456" autocomplete="new-password" />
            <input class="lock-input" id="lockPin2" type="password" maxlength="12" placeholder="Ulangi PIN" autocomplete="new-password" style="margin-top:8px;display:none;" />
            <button type="button" id="lockToggle" style="background:none;border:none;color:var(--text-secondary);font-size:0.8rem;cursor:pointer;margin-top:8px;">Lihat PIN</button>
            <button class="lock-btn" id="lockGo">Buka</button>
            <button type="button" id="lockChangePin" style="background:none;border:none;color:var(--text-secondary);font-size:0.8rem;cursor:pointer;margin-top:8px;text-decoration:underline;">Ganti PIN</button>
            <div class="lock-err" id="lockErr"></div>
        </div>
    </div>

    <div class="lock-overlay" id="changeOverlay" hidden>
        <div class="lock-card">
            <div class="lock-title">Ganti PIN</div>
            <div class="lock-sub">Masukkan PIN lama lalu PIN baru 4-12 digit angka.</div>
            <input class="lock-input" id="oldPin" type="password" maxlength="12" placeholder="PIN lama" autocomplete="new-password" />
            <input class="lock-input" id="newPin" type="password" maxlength="12" placeholder="PIN baru" autocomplete="new-password" style="margin-top:8px;" />
            <input class="lock-input" id="newPin2" type="password" maxlength="12" placeholder="Ulangi PIN baru" autocomplete="new-password" style="margin-top:8px;" />
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="lock-btn" id="changeCancel" type="button" style="background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);">Batal</button>
                <button class="lock-btn" id="changeGo" type="button">Simpan</button>
            </div>
            <div class="lock-err" id="changeErr"></div>
        </div>
    </div>

    <script>
        const notepad = document.getElementById('notepad');
        const lineNumbers = document.getElementById('lineNumbers');
        const charCount = document.getElementById('charCount');
        const lineCount = document.getElementById('lineCount');
        const notepadApp = document.getElementById('notepadApp');
        const closeBtn = document.getElementById('closeBtn');
        const insertBtn = document.getElementById('insertBtn');
        const exportBtn = document.getElementById('exportBtn');

        const defaultText = `Nama     : Email Utama
Username : contoh.email@gmail.com
Password : Password123!
Catatan  : Email pemulihan terhubung ke HP

-----------------------------------------

Nama     : Akun Bisnis
Username : @bisnissaya
Password : RahasiaSuper2026
Catatan  : Autentikasi 2FA aktif

-----------------------------------------
`;

        let lockMode = 'unlock';
        const lockOverlay = document.getElementById('lockOverlay');
        const lockTitle = document.getElementById('lockTitle');
        const lockSub = document.getElementById('lockSub');
        const lockPin = document.getElementById('lockPin');
        const lockPin2 = document.getElementById('lockPin2');
        const lockGo = document.getElementById('lockGo');
        const lockErr = document.getElementById('lockErr');

        function showLock(mode, msg) {
            lockMode = mode;
            lockOverlay.hidden = false;
            lockErr.textContent = msg || '';
            lockPin.value = '';
            lockPin2.value = '';
            if (mode === 'setup') {
                lockTitle.textContent = 'Buat PIN Catatan';
                lockSub.textContent = 'Buat PIN 4-12 digit angka saja (contoh: 123456). File lama otomatis di-backup & dienkripsi.';
                lockPin.placeholder = '123456';
                lockPin2.style.display = 'block';
                lockGo.textContent = 'Buat & Enkripsi';
                document.getElementById('lockChangePin').style.display = 'none';
            } else {
                lockTitle.textContent = 'Catatan Terkunci';
                lockSub.textContent = 'Masukkan PIN 4-12 digit angka untuk membuka catatan.';
                lockPin.placeholder = '123456';
                lockPin2.style.display = 'none';
                lockGo.textContent = 'Buka';
                document.getElementById('lockChangePin').style.display = 'block';
            }
            setTimeout(() => { try { lockPin.focus(); } catch (_) {} }, 100);
        }

        function hideLock() { lockOverlay.hidden = true; }

        function loadEditorText() {
            window.catatanAPI.load().then(text => {
                if (text !== null) {
                    notepad.value = text;
                } else {
                    notepad.value = defaultText;
                    window.catatanAPI.save(notepad.value);
                }
                updateEditorStats();
            });
        }

        async function refreshLockState() {
            try {
                const st = await window.catatanAPI.status();
                if (!st.encrypted && !st.hasLegacy) {
                    showLock('setup', '');
                    return;
                }
                if (st.encrypted && !st.unlocked) {
                    showLock('unlock', st.lockedOutUntil ? 'Terkunci sementara. Tunggu sebentar.' : '');
                    return;
                }
                if (!st.encrypted && st.hasLegacy) {
                    showLock('setup', 'Amankan catatan lama dengan PIN agar login & tanda tangan tetap jalan tapi file tidak bisa dibaca orang.');
                    return;
                }
                hideLock();
                loadEditorText();
            } catch (_) {
                hideLock();
                loadEditorText();
            }
        }

        function cleanPin(v) { return String(v || '').trim().replace(/\D/g, '').slice(0, 12); }

        async function submitPin() {
            const raw = String(lockPin.value || '');
            const pin = cleanPin(raw);
            lockErr.textContent = '';
            if (!/^\d{4,12}$/.test(pin)) {
                if (!pin) lockErr.textContent = 'Isi PIN dulu (4-12 digit angka). Yang diketik belum masuk.';
                else lockErr.textContent = 'PIN kurang: baru ' + pin.length + ' digit, minimal 4 digit angka.';
                return;
            }
            lockGo.disabled = true;
            try {
                if (lockMode === 'setup') {
                    const pin2 = cleanPin(lockPin2.value.trim());
                    lockPin2.value = pin2;
                    if (pin !== pin2) { lockErr.textContent = 'PIN tidak sama. Ulangi.'; lockGo.disabled = false; return; }
                    const r = await window.catatanAPI.setupPin(pin);
                    if (r && r.ok) { hideLock(); loadEditorText(); showToast('Catatan dienkripsi!'); }
                    else lockErr.textContent = (r && r.reason) || 'Gagal membuat PIN.';
                } else {
                    const r = await window.catatanAPI.unlock(pin);
                    if (r && r.ok) { hideLock(); loadEditorText(); }
                    else lockErr.textContent = (r && r.reason) || 'PIN salah.';
                }
            } catch (e) {
                lockErr.textContent = 'Gagal: ' + (e.message || e);
            }
            lockGo.disabled = false;
        }

        document.getElementById('lockToggle').addEventListener('click', () => {
            const show = lockPin.type === 'password';
            lockPin.type = show ? 'text' : 'password';
            lockPin2.type = show ? 'text' : 'password';
        });

        lockGo.addEventListener('click', submitPin);
        lockPin.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
        lockPin2.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });

        const changeOverlay = document.getElementById('changeOverlay');
        const oldPinEl = document.getElementById('oldPin');
        const newPinEl = document.getElementById('newPin');
        const newPin2El = document.getElementById('newPin2');
        const changeErr = document.getElementById('changeErr');
        const changePinBtn = document.getElementById('changePinBtn');

        function openChangePin() {
            changeErr.textContent = '';
            oldPinEl.value = '';
            newPinEl.value = '';
            newPin2El.value = '';
            changeOverlay.hidden = false;
            setTimeout(() => { try { oldPinEl.focus(); } catch (_) {} }, 100);
        }
        function closeChangePin() { changeOverlay.hidden = true; }

        async function submitChangePin() {
            const oldPin = cleanPin(oldPinEl.value);
            const newPin = cleanPin(newPinEl.value);
            const newPin2 = cleanPin(newPin2El.value);
            changeErr.textContent = '';
            if (!/^\d{4,12}$/.test(oldPin)) { changeErr.textContent = 'PIN lama harus 4-12 digit angka.'; return; }
            if (!/^\d{4,12}$/.test(newPin)) { changeErr.textContent = 'PIN baru kurang: baru ' + newPin.length + ' digit, minimal 4.'; return; }
            if (newPin !== newPin2) { changeErr.textContent = 'PIN baru tidak sama. Ulangi.'; return; }
            if (oldPin === newPin) { changeErr.textContent = 'PIN baru sama dengan PIN lama.'; return; }
            const btn = document.getElementById('changeGo');
            btn.disabled = true;
            try {
                const r = await window.catatanAPI.changePin(oldPin, newPin);
                if (r && r.ok) {
                    closeChangePin();
                    // Kalau ganti dari layar kunci, langsung buka juga
                    if (!lockOverlay.hidden) { hideLock(); loadEditorText(); }
                    showToast('PIN berhasil diganti!');
                }
                else changeErr.textContent = (r && r.reason) || 'Gagal ganti PIN.';
            } catch (e) {
                changeErr.textContent = 'Gagal: ' + (e.message || e);
            }
            btn.disabled = false;
        }

        changePinBtn.addEventListener('click', openChangePin);
        document.getElementById('lockChangePin').addEventListener('click', () => {
            if (lockMode === 'setup') return;
            changeErr.textContent = '';
            oldPinEl.value = String(lockPin.value || '');
            newPinEl.value = '';
            newPin2El.value = '';
            changeOverlay.hidden = false;
        });
        document.getElementById('changeCancel').addEventListener('click', closeChangePin);
        document.getElementById('changeGo').addEventListener('click', submitChangePin);

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const theme = new URLSearchParams(location.search).get('theme');
                if (theme === 'oneDark') document.body.classList.add('theme-one-dark');
            } catch (_) { }
            refreshLockState();
        });

        notepad.addEventListener('input', () => {
            updateEditorStats();
            window.catatanAPI.save(notepad.value);
        });

        notepad.addEventListener('scroll', () => {
            lineNumbers.scrollTop = notepad.scrollTop;
        });

        closeBtn.addEventListener('click', () => {
            window.close();
        });

        insertBtn.addEventListener('click', insertTemplate);
        exportBtn.addEventListener('click', exportNotes);

        function exportNotes() {
            const text = notepad.value;
            if (!text.trim()) { showToast('Catatan kosong!'); return; }
            window.catatanAPI.export(text).then(ok => {
                if (ok) showToast('Catatan berhasil di-export!');
                else showToast('Export gagal');
            });
        }

        function updateEditorStats() {
            const text = notepad.value;
            const lines = text.split('\n');
            const totalLines = lines.length;

            let lineNumHTML = '';
            for (let i = 1; i <= totalLines; i++) {
                lineNumHTML += i + '<br>';
            }
            lineNumbers.innerHTML = lineNumHTML;

            charCount.textContent = text.length + ' karakter';
            lineCount.textContent = totalLines + ' baris';
        }

        function insertTemplate() {
            const template = `Nama     : \nUsername : \nPassword : \nCatatan  : \n-----------------------------------------\n`;
            
            const start = notepad.selectionStart;
            const end = notepad.selectionEnd;
            const text = notepad.value;

            notepad.value = text.substring(0, start) + template + text.substring(end);
            notepad.selectionStart = notepad.selectionEnd = start + template.length;
            
            notepad.focus();
            updateEditorStats();
            window.catatanAPI.save(notepad.value);
            showToast('Format akun ditambahkan!');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
